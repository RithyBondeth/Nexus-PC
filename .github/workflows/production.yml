name: Production foundation
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app/production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Verify generated bridge is current
        run: |
          bash ../../tools/generate-production-api.sh
          git diff --exit-code -- lib/platform/nexus_api.g.dart android/app/src/main/kotlin/com/nexuspc/app/NexusApi.g.kt
      - run: dart format --output=none --set-exit-if-changed lib pigeons test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - name: Guest memory adapter guard tests
        run: bash ../../tools/run-guest-memory-tests.sh
      - name: Native page auditor regression tests
        run: python3 ../../tools/test_runtime_pages.py
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Native ELF and packaging alignment
        run: python3 ../../tools/check_runtime_pages.py build/app/outputs/flutter-apk/app-debug.apk > build/runtime-page-audit.json
      - name: Android unit tests and lint
        working-directory: app/production/android
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Unsigned production release compilation
        run: flutter build apk --release --target-platform android-arm64 -t lib/main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-pc-production-debug
          path: app/production/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
